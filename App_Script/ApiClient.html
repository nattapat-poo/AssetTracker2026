  function invokeJsonp(url, action, payload) {
    return new Promise(function(resolve, reject) {
      var callbackName = "gas_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
      var timeoutTimer = null;

      window[callbackName] = function(data) {
        cleanup();
        resolve(data);
      };

      function cleanup() {
        if (timeoutTimer) clearTimeout(timeoutTimer);
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        var el = document.getElementById(callbackName);
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }

      timeoutTimer = setTimeout(function() {
        cleanup();
        reject(new Error("JSONP request timed out after 45s"));
      }, 45000);

      var script = document.createElement("script");
      script.id = callbackName;
      var params = new URLSearchParams();
      params.set("action", action);
      params.set("payload", JSON.stringify(payload || {}));
      params.set("callback", callbackName);

      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + params.toString();
      script.onerror = function(err) {
        cleanup();
        reject(new Error("JSONP script load error: " + (err && err.message ? err.message : "Network error")));
      };

      document.body.appendChild(script);
    });
  }

  function invoke(action, payload) {
    return new Promise(function(resolve, reject) {

            }
            resolve(jsonpData);
          })
          .catch(function(jsonpErr) {
            console.warn("[ApiClient] JSONP bridge failed, trying HTTPS POST fetch fallback:", jsonpErr);

            fetch(targetUrl, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ action: action, payload: payload })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              window.__IS_LIVE_CONNECTED = true;
              window.__ACTIVE_BRIDGE_TYPE = "GAS_REST_POST";
              if (data && data.summary && Array.isArray(data.summary.items) && data.summary.items.length > 0) {

              }
              resolve(data);
            })
            .catch(function(postErr) {

              var res = mockExecute(action, payload);
              resolve(res);
            });

            var res = mockExecute(action, payload);
            resolve(res);
          } catch (err) {
            reject(err);
          }
        }, 120);

    });

    var total = items.length;
    var verified = 0;
    var good = 0;
    var damaged = 0;
    var missing = 0;

    items.forEach(function(a) {
      if (a.status === "Good" || a.status === "Damaged" || a.status === "Missing" || a.status === "ใช้งานอยู่" || a.status === "ใช้งานอยู่แต่ชำรุดนะ") {
        verified++;
        if (a.status === "Good" || a.status === "ใช้งานอยู่") good++;
        else if (a.status === "Damaged" || a.status === "ใช้งานอยู่แต่ชำรุดนะ") damaged++;
        else if (a.status === "Missing" || a.status === "สูญหาย") missing++;
      }
    });

    return {
      roomName: roomName || "Master_Asset",
      total: total,
      verified: verified,
      unverified: total - verified,
      good: good,
      damaged: damaged,
      missing: missing,
      percentComplete: total > 0 ? Math.round((verified / total) * 100) : 0,
      items: items
    };
  }

  return {
    isGasEnvironment: isGasEnvironment,
    getGasEndpointUrl: getGasEndpointUrl,
    setGasEndpointUrl: setGasEndpointUrl,
    getBridgeStatus: function() {
      return {
        isGasEnvironment: isGasEnvironment,
        isRemoteLiveMode: isRemoteLiveMode,
        isLiveConnected: !!window.__IS_LIVE_CONNECTED,
        bridgeType: window.__ACTIVE_BRIDGE_TYPE || (isGasEnvironment ? "GAS_NATIVE" : "OFFLINE_MOCK"),
        endpointUrl: getGasEndpointUrl(),
        lastError: window.__LAST_CONN_ERROR || null
      };
    },
    seedMockAssetsForTesting: function(assets) {
      MOCK_ASSETS = Array.isArray(assets) ? assets.slice() : [];
      return MOCK_ASSETS.length;
    },
    clearLocalCache: clearLocalCache,
    invoke: invoke,
    getInitialPayload: function() {
      var u = (typeof window !== "undefined" && window.AppState && typeof AppState.get === "function") ? AppState.get("user") : null;
      var email = (u && u.email) ? u.email : "nattapat.poo@mahidol.ac.th";
      return invoke("getInitialPayload", { clientEmail: email });
    },
    lookupAsset: function(assetCode) { return invoke("lookupAsset", { assetCode: assetCode }); },
    updateAssetStatus: function(payload) {
      if (!payload) payload = {};
      if (!payload.clientEmail) {
        var u = (typeof window !== "undefined" && window.AppState && typeof AppState.get === "function") ? AppState.get("user") : null;
        payload.clientEmail = (u && u.email) ? u.email : "nattapat.poo@mahidol.ac.th";
      }
      return invoke("updateAssetStatus", payload);
    },
    addNewUnlistedAsset: function(payload) { return invoke("addNewUnlistedAsset", payload); },
    getRoomAuditSummary: function(roomName) { return invoke("getRoomAuditSummary", { roomName: roomName }); },
    getAppUsageStats: function() { return invoke("getAppUsageStats", {}); },
    setupRow5Headers: function() { return invoke("setupRow5Headers", {}); },
    syncConfigSheet: function() { return invoke("syncConfigSheet", {}); },
    buildMasterTable: function(sheetNames) { return invoke("buildMasterTable", { sheetNames: sheetNames }); },
    migrateMasterToRooms: function() { return invoke("migrateMasterToRooms", {}); },
    checkMasterContradictions: function() { return invoke("checkMasterContradictions", {}); },
    queryMasterTable: function(filters) { return invoke("queryMasterTable", { filters: filters }); },
    flushCache: function() { return invoke("flushCache", {}); },
    verifyMahidolUser: function(email) { return invoke("verifyMahidolUser", { email: email }); }
  };
})();
</script>
