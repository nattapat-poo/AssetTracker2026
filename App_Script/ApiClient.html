  function invokeJsonp(url, action, payload) {
    return new Promise(function(resolve, reject) {
      var callbackName = "gas_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
      var timeoutTimer = null;

      window[callbackName] = function(data) {
        cleanup();
        resolve(data);
      };

      function cleanup() {
        if (timeoutTimer) clearTimeout(timeoutTimer);
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        var el = document.getElementById(callbackName);
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }

      timeoutTimer = setTimeout(function() {
        cleanup();
        reject(new Error("JSONP request timed out after 12s"));
      }, 12000);

      var script = document.createElement("script");
      script.id = callbackName;
      var params = new URLSearchParams();
      params.set("action", action);
      params.set("payload", JSON.stringify(payload || {}));
      params.set("callback", callbackName);

      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + params.toString();
      script.onerror = function(err) {
        cleanup();
        reject(new Error("JSONP script load error: " + (err && err.message ? err.message : "Network error")));
      };

      document.body.appendChild(script);
    });
  }

  function invoke(action, payload) {
    return new Promise(function(resolve, reject) {
      if (isGasEnvironment) {
        window.__ACTIVE_BRIDGE_TYPE = "GAS_NATIVE";
        window.__IS_LIVE_CONNECTED = true;
        google.script.run
          .withSuccessHandler(function(res) {
            resolve(res);
          })
          .withFailureHandler(function(err) {
            console.error("[ApiClient] Server Error:", err);
            reject(err);
          })
          .executeApiAction(action, payload);
      } else if (isRemoteLiveMode) {
        var targetUrl = getGasEndpointUrl();
        // 1. First attempt: HTTPS POST fetch bridge
        fetch(targetUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, payload: payload })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.error && !data.success && data.found === undefined) {
            console.warn("[ApiClient] Remote API returned error:", data.error);
          }
          window.__IS_LIVE_CONNECTED = true;
          window.__ACTIVE_BRIDGE_TYPE = "GAS_REST_POST";
          resolve(data);
        })
        .catch(function(postErr) {
          console.warn("[ApiClient] GAS POST fetch failed, attempting JSONP fallback bridge:", postErr);
          // 2. Second attempt: JSONP GET script injection bridge (bypasses CORS/redirect blocks)
          invokeJsonp(targetUrl, action, payload)
            .then(function(jsonpData) {
              window.__IS_LIVE_CONNECTED = true;
              window.__ACTIVE_BRIDGE_TYPE = "GAS_JSONP";
              resolve(jsonpData);
            })
            .catch(function(jsonpErr) {
              console.warn("[ApiClient] Both POST & JSONP bridges failed. Falling back to local mock store:", jsonpErr);
              window.__IS_LIVE_CONNECTED = false;
              window.__ACTIVE_BRIDGE_TYPE = "OFFLINE_MOCK";
              window.__LAST_CONN_ERROR = postErr.message || jsonpErr.message;
              var res = mockExecute(action, payload);
              resolve(res);
            });
        });
      } else {
        // Mock offline execution
        window.__ACTIVE_BRIDGE_TYPE = "OFFLINE_MOCK";
        setTimeout(function() {
          try {
            var res = mockExecute(action, payload);
            resolve(res);
          } catch (err) {
            reject(err);
          }
        }, 120);
      }
    });
  }

    if (action === "setupRow5Headers") {

    if (action === "buildMasterTable") {

        totalAssets: MOCK_ASSETS.length,

      };
    }

    if (action === "migrateMasterToRooms") {
      return {
        success: true,
        message: "Successfully migrated " + MOCK_ASSETS.length + " asset records across " + MOCK_ROOMS.length + " room sheets.",
        rowsMigrated: MOCK_ASSETS.length,
        sheetsAffected: MOCK_ROOMS.length
      };
    }

    if (action === "queryMasterTable") {
      var filters = payload.filters || {};
      var items = MOCK_ASSETS.slice();
      if (filters.room && filters.room !== "ALL") {
        items = items.filter(function(a) { return a.registeredLocation === filters.room; });
      }
      if (filters.status && filters.status !== "ALL") {
        items = items.filter(function(a) { return a.status === filters.status; });
      }
      if (filters.search) {
        var s = filters.search.toLowerCase();
        items = items.filter(function(a) {
          return (a.assetId && a.assetId.toLowerCase().indexOf(s) !== -1) ||
                 (a.itemName && a.itemName.toLowerCase().indexOf(s) !== -1) ||
                 (a.registeredLocation && a.registeredLocation.toLowerCase().indexOf(s) !== -1) ||
                 (a.scanned69 && a.scanned69.toLowerCase().indexOf(s) !== -1) ||
                 (a.status && a.status.toLowerCase().indexOf(s) !== -1) ||
                 (a.auditResult69 && a.auditResult69.toLowerCase().indexOf(s) !== -1) ||
                 (a.sticker && a.sticker.toLowerCase().indexOf(s) !== -1);
        });
      }
      return {
        total: items.length,
        items: items
      };
    }

    if (action === "lookupAsset") {
      var code = String(payload.assetCode || "").trim().toUpperCase();
      // Also match URL stripped code
      if (code.indexOf("ID=") !== -1) {
        var match = code.match(/ID=([^&]+)/);
        if (match) code = match[1];
      }
      
      var asset = MOCK_ASSETS.find(function(a) {
        return a.assetId.toUpperCase() === code;
      });

      if (asset) {
        return { found: true, asset: Object.assign({}, asset) };
      }
      return { found: false, assetCode: payload.assetCode, error: "Asset ID '" + payload.assetCode + "' not found in registered rooms." };
    }

    if (action === "updateAssetStatus") {
      var targetId = String(payload.assetId || "").trim().toUpperCase();
      var asset = MOCK_ASSETS.find(function(a) { return a.assetId.toUpperCase() === targetId; });
      
      if (!asset) {
        throw new Error("Asset not found in mock store.");
      }

      var ts = new Date().toISOString().replace('T', ' ').substring(0, 19);
      asset.status = payload.status;
      asset.scanned69 = payload.status;
      asset.sticker = payload.sticker || "ปกติ";
      asset.auditedBy = "nattapat.poo@mahidol.ac.th";
      asset.auditDate = ts;
      if (payload.destinationRoom) {
        asset.registeredLocation = payload.destinationRoom;
      }
      if (payload.renameText) {
        asset.itemName = payload.renameText;
      }
      if (payload.notes) {
        asset.notes = asset.notes ? (asset.notes + " | " + payload.notes) : payload.notes;
      }
      if (payload.currentRoom && payload.currentRoom !== asset.registeredLocation) {
        asset.foundLocation = payload.currentRoom;
      }

      persistAssetsCache();
      var summary = mockGetRoomSummary(asset.registeredLocation);
      return {
        success: true,
        assetId: asset.assetId,
        sheetName: asset.registeredLocation,
        rowIndex: asset.rowIndex,
        status: asset.status,
        scanned69: asset.scanned69,
        sticker: asset.sticker,
        auditedBy: asset.auditedBy,
        auditDate: asset.auditDate,
        notes: asset.notes,
        foundLocation: asset.foundLocation,
        roomSummary: summary
      };
    }

    if (action === "getRoomAuditSummary") {
      return mockGetRoomSummary(payload.roomName);
    }

    if (action === "addNewUnlistedAsset") {
      var rawId = String(payload.assetId || "").trim();

      var newAsset = {

        itemName: name,
        brandModel: "",
        registeredLocation: room,
        sheetName: room,
        rowIndex: MOCK_ASSETS.length + 2,

        auditResult69: nt,
        sticker: stk,
        procurementCondition: "ใช้งานได้",
        historicalResults: {},
        notes: nt
      };
      MOCK_ASSETS.push(newAsset);
      persistAssetsCache();
      var summ = mockGetRoomSummary(room);
      return {
        success: true,
        message: "Successfully added and audited unlisted asset " + rawId,
        assetId: rawId,
        itemName: name,
        sheetName: room,
        registeredLocation: room,
        status: st,
        scanned69: st,
        auditResult69: nt,
        sticker: stk,
        asset: newAsset,
        roomSummary: summ
      };
    }

    if (action === "syncConfigSheet") {
      return {
        success: true,
        message: "Config sheet synchronized (v1.1.7e). Local mock simulation mode.",
        appVersion: "v1.1.7e",
        timestamp: new Date().toISOString(),
        keysAdded: 0,
        keysUpdated: 1
      };
    }

    if (action === "checkMasterContradictions") {
      return {
        success: true,
        totalScanned: MOCK_ASSETS.length,
        duplicatesCount: 0,
        duplicateRowsCount: 0,
        duplicatesList: [],
        missingIdCount: 0,
        missingIdRows: [],
        message: "No contradictions found. All assets in Master Table have unique inventory numbers."
      };
    }

    if (action === "flushCache") {
      return { success: true, message: "Mock cache purged." };
    }

    if (action === "getAppUsageStats") {
      var total = MOCK_ASSETS.length;
      var audited = MOCK_ASSETS.filter(function(a) { return a.status || a.scanned69; }).length;
      return {
        success: true,
        stats: {
          totalAssets: total,
          totalAudited: audited,
          totalRemaining: total - audited,
          percentComplete: total > 0 ? Math.round((audited / total) * 1000) / 10 : 0,
          statusCounts: {
            "ใช้งานอยู่": 4,
            "ใช้งานอยู่แต่ชำรุดนะ": 1
          },
          stickerCounts: {
            "ปกติ": 4,
            "ปริ้นใหม่": 1
          },
          auditorLeaderboard: [
            { name: "Nattapat Poolyam (Mek)", count: audited }
          ],

            { room: "Chem1", total: 3, audited: 2, percent: 66.7 },

      };
    }

    if (action === "logStat" || action === "logEvent") {
      return { success: true };

    throw new Error("Mock does not support action: " + action);

  function mockGetRoomSummary(roomName) {
    var items = [];
    if (!roomName || roomName === "ALL" || roomName === "Master_Asset" || roomName === "Master" || roomName === "Master Table") {
      items = MOCK_ASSETS.slice();
    } else {
      items = MOCK_ASSETS.filter(function(a) { return a.registeredLocation === roomName; });
    }

    var total = items.length;
    var verified = 0;
    var good = 0;
    var damaged = 0;
    var missing = 0;

    items.forEach(function(a) {
      if (a.status === "Good" || a.status === "Damaged" || a.status === "Missing" || a.status === "ใช้งานอยู่" || a.status === "ใช้งานอยู่แต่ชำรุดนะ") {
        verified++;
        if (a.status === "Good" || a.status === "ใช้งานอยู่") good++;
        else if (a.status === "Damaged" || a.status === "ใช้งานอยู่แต่ชำรุดนะ") damaged++;
        else if (a.status === "Missing" || a.status === "สูญหาย") missing++;
      }
    });

    return {
      roomName: roomName || "Master_Asset",
      total: total,
      verified: verified,
      unverified: total - verified,
      good: good,
      damaged: damaged,
      missing: missing,
      percentComplete: total > 0 ? Math.round((verified / total) * 100) : 0,
      items: items
    };
  }

      };
    },

    invoke: invoke,
    getInitialPayload: function() { return invoke("getInitialPayload", {}); },
    lookupAsset: function(assetCode) { return invoke("lookupAsset", { assetCode: assetCode }); },

    getRoomAuditSummary: function(roomName) { return invoke("getRoomAuditSummary", { roomName: roomName }); },

    flushCache: function() { return invoke("flushCache", {}); }
