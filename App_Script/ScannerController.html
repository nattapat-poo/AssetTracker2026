<script>
/**
 * ScannerController.html — Multi-Modal QR Camera Scanner Engine (v1.1.8h)
 * Project 08: QR-Based Mobile Asset Survey App (v1.1.8h)
 * MUIDS Lab Oops OS — Science Department
 *
 * Supports:
 * 1. Mode 1: Instant Native Camera Snap (<input type="file" capture="environment">)
 *    Bypasses GAS sandboxed iframe permission policy restrictions 100% on iOS/Android.
 * 2. Mode 2: Hardware-Accelerated 60fps Native BarcodeDetector (AppSheet Parity)
 *    Direct requestAnimationFrame loop on <video> stream; sub-5ms instant detection.
 * 3. Mode 3: Smart Laptop Webcam Fallback via Html5Qrcode.getCameras()
 *    Full-frame uncropped scanning with continuous autofocus.
 */

window.ScannerController = (function() {
  var html5QrCode = null;
  var isScanning = false;
  var lastScannedCode = null;
  var lastScanTimestamp = 0;
  var scanCooldownMs = 1800; // 1.8s debounce to prevent duplicate popups
  var currentFacingMode = "environment"; // "environment" (rear) or "user" (front)
  var torchActive = false;
  var isProcessingFile = false;
  var audioCtx = null;

  var nativeBarcodeDetector = null;
  var nativeScanAnimId = null;
  var isNativeDetecting = false;

  if (typeof window !== "undefined" && "BarcodeDetector" in window) {
    try {
      nativeBarcodeDetector = new window.BarcodeDetector({ formats: ["qr_code", "code_128", "code_39", "ean_13"] });
    } catch (e) {
      console.warn("[ScannerController] Native BarcodeDetector init:", e);
    }
  }

  function startNativeDetectionLoop(videoElem) {
    if (!nativeBarcodeDetector || !videoElem) return;
    if (nativeScanAnimId) {
      cancelAnimationFrame(nativeScanAnimId);
      nativeScanAnimId = null;
    }

    function scanFrame() {
      if (!isScanning) return;
      if (videoElem.readyState >= 2 && videoElem.videoWidth > 0 && !isNativeDetecting && !isProcessingFile) {
        isNativeDetecting = true;
        nativeBarcodeDetector.detect(videoElem)
          .then(function(barcodes) {
            isNativeDetecting = false;
            if (barcodes && barcodes.length > 0 && isScanning) {
              var code = barcodes[0].rawValue || barcodes[0].value;
              if (code && String(code).trim() !== "") {
                onScanSuccess(code, { result: { text: code } });
                return;
              }
            }
            if (isScanning) {
              nativeScanAnimId = requestAnimationFrame(scanFrame);
            }
          })
          .catch(function() {
            isNativeDetecting = false;
            if (isScanning) {
              nativeScanAnimId = requestAnimationFrame(scanFrame);
            }
          });
      } else if (isScanning) {
        nativeScanAnimId = requestAnimationFrame(scanFrame);
      }
    }

    nativeScanAnimId = requestAnimationFrame(scanFrame);
  }

  function stopNativeDetectionLoop() {
    if (nativeScanAnimId) {
      cancelAnimationFrame(nativeScanAnimId);
      nativeScanAnimId = null;
    }
    isNativeDetecting = false;
  }

  function initAudioContext() {
    if (!audioCtx) {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  // Pleasant double-tone success chime
  function playSuccessChime() {
    if (!AppState.get("soundEnabled")) return;
    try {
      initAudioContext();
      if (!audioCtx) return;

      var now = audioCtx.currentTime;
      var osc1 = audioCtx.createOscillator();
      var gain1 = audioCtx.createGain();
      osc1.type = "sine";
      osc1.frequency.setValueAtTime(880, now); // A5
      gain1.gain.setValueAtTime(0.15, now);
      gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.08);

      var osc2 = audioCtx.createOscillator();
      var gain2 = audioCtx.createGain();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(1318.5, now + 0.07); // E6
      gain2.gain.setValueAtTime(0.2, now + 0.07);
      gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.07);
      osc2.stop(now + 0.22);
    } catch (e) {
      console.warn("Audio chime error:", e);
    }
  }

  // Asset inventory number format validator (e.g. 4356000-401000049664-0 or #######-############_#)
  function isValidAssetInventoryFormat(code) {
    if (!code) return false;
    var clean = String(code).trim();
    var assetCodeRegex = /^\d{7}-\d{12}[-_]\d+$/;
    return assetCodeRegex.test(clean);
  }

  // Haptic feedback for mobile phones (short for valid asset QR, longer for mismatch)
  function triggerHaptic(isMismatch) {
    if (!AppState.get("hapticEnabled")) return;
    if ("vibrate" in navigator) {
      try {
        if (isMismatch) {
          // Scanned QR does NOT match standard inventory format: longer vibration pattern
          navigator.vibrate([400, 150, 400]);
        } else {
          // Standard successful scan vibration
          navigator.vibrate([60, 40, 60]);
        }
      } catch (e) {}
    }
  }

  /**
   * Mode 1: Instant Native Camera Snap
   * Launches phone's native camera directly. 100% bypass of GAS iframe permission policy.
   */
  function openNativeCameraSnap() {
    initAudioContext();
    if (AppState.logActivity) {
      AppState.logActivity("snap", "ถ่ายภาพ QR ด้วยกล้องมือถือ (Snap Camera)", {
        notes: "Native OS camera capture triggered via <input type=file capture=environment>"
      });
    }
    var input = document.getElementById("native-camera-input");
    if (input) {
      input.value = ""; // Reset to allow re-capturing same QR
      input.click();
    } else {
      ModalController.showToast("Camera snap input not found.", "warning");
    }
  }

  /**
   * Gallery Picker for uploaded QR pictures
   */
  function openGalleryPicker() {
    initAudioContext();
    var input = document.getElementById("gallery-file-input");
    if (input) {
      input.value = "";
      input.click();
    }
  }

  /**
   * Mode 2: Live Video Stream Scanner (v1.1.8f: RCA-Hardened Constraints & Telemetry)
   */
  function startScanner() {
    if (isScanning) return;
    initAudioContext();

    var isSecure = (typeof window !== "undefined" && window.isSecureContext);
    var hasMediaDevices = (typeof navigator !== "undefined" && navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function");
    var inIframe = (typeof window !== "undefined" && window.self !== window.top);

    if (AppState.logActivity) {
      AppState.logActivity("camera", "เริ่มเปิดกล้องสด (Camera Attempt)", {
        notes: "Facing: " + currentFacingMode + ", Secure: " + isSecure + ", MediaDevices: " + !!hasMediaDevices + ", InIframe: " + inIframe
      });
    }

    var readerElement = document.getElementById("qr-reader");
    if (!readerElement) return;

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("qr-reader");
    }

    var qrConfig = {
      fps: 25,
      aspectRatio: 1.0,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    ModalController.showToast("Initializing camera stream...", "info", 1500);

    // RCA Fix: Use standard Html5Qrcode constraint format { facingMode: "environment" | "user" }
    // Passing nested objects like { facingMode: { ideal: ... } } triggers OverconstrainedError/TypeError on iOS Safari & Android Chrome
    var primaryConstraint = { facingMode: currentFacingMode };

    function runStart(constraint) {
      return html5QrCode.start(
        constraint,
        qrConfig,
        onScanSuccess,
        onScanProgress
      );
    }

    runStart(primaryConstraint)
      .then(function() {
        isScanning = true;
        AppState.set("isScannerRunning", true);
        updateScannerControlsUI();
        showScanLaser(true);
        var v = document.querySelector("#qr-reader video");
        if (v) {
          v.setAttribute("playsinline", "true");
          v.setAttribute("webkit-playsinline", "true");
          v.setAttribute("autoplay", "true");
          v.muted = true;
          startNativeDetectionLoop(v);
        }
        if (AppState.logActivity) {
          AppState.logActivity("camera", "เชื่อมต่อกล้องสดสำเร็จ (Camera Ready)", {
            notes: "Live 60fps stream active on " + currentFacingMode + " lens"
          });
        }
        ModalController.showToast("Camera active (Instant Scan).", "success", 2000);
      })
      .catch(function(primaryErr) {
        console.warn("Primary facingMode failed, falling back to camera enumeration:", primaryErr);
        // Fallback: Camera enumeration for laptops/webcams or specific sensor selection
        Html5Qrcode.getCameras().then(function(cameras) {
          var fallbackChoice = { facingMode: "user" };
          if (cameras && cameras.length > 0 && cameras[0].id) {
            fallbackChoice = cameras[0].id;
          }
          return runStart(fallbackChoice);
        }).then(function() {
          isScanning = true;
          AppState.set("isScannerRunning", true);
          updateScannerControlsUI();
          showScanLaser(true);
          var vFallback = document.querySelector("#qr-reader video");
          if (vFallback) {
            vFallback.setAttribute("playsinline", "true");
            vFallback.setAttribute("webkit-playsinline", "true");
            vFallback.setAttribute("autoplay", "true");
            vFallback.muted = true;
            startNativeDetectionLoop(vFallback);
          }
          if (AppState.logActivity) {
            AppState.logActivity("camera", "เชื่อมต่อกล้องสำเร็จผ่าน Fallback (Fallback Ready)", {
              notes: "Camera stream active via fallback enumeration"
            });
          }
        }).catch(function(finalErr) {
          stopNativeDetectionLoop();
          console.warn("Live stream start failed:", finalErr);
          isScanning = false;
          AppState.set("isScannerRunning", false);
          updateScannerControlsUI();
          showScanLaser(false);

          var errName = (finalErr && finalErr.name) || "Error";
          var errMsg = (finalErr && finalErr.message) || String(finalErr);
          if (AppState.logActivity) {
            AppState.logActivity("camera", "เชื่อมต่อกล้องไม่สำเร็จ (Camera Error)", {
              status: "error",
              notes: errName + ": " + errMsg + " (InIframe: " + inIframe + ", Secure: " + isSecure + ")"
            });
          }

          var errStr = String(finalErr || "").toLowerCase();
          var isPermIssue = errStr.indexOf("notallowed") !== -1 ||
                            errStr.indexOf("permission") !== -1 ||
                            errStr.indexOf("securityerror") !== -1 ||
                            errStr.indexOf("policy") !== -1;

          if (isPermIssue) {
            ModalController.showToast("⚠️ Camera permission blocked. Tap '📸 Snap Photo with Camera' to scan without restrictions!", "warning", 5500);
          } else {
            ModalController.showToast("Live video unavailable (" + errName + "). Tap '📸 Snap Photo with Camera' to scan directly!", "warning", 5500);
          }
        });
      });
  }

  function stopScanner() {
    stopNativeDetectionLoop();
    if (!isScanning || !html5QrCode) return Promise.resolve();

    return html5QrCode.stop().then(function() {
      stopNativeDetectionLoop();
      isScanning = false;
      torchActive = false;
      AppState.set("isScannerRunning", false);
      updateScannerControlsUI();
      showScanLaser(false);
    }).catch(function(err) {
      stopNativeDetectionLoop();
      console.error("Failed to stop camera:", err);
    });
  }

  function toggleCameraFacing() {
    currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
    if (isScanning) {
      stopScanner().then(function() {
        startScanner();
      });
    }
  }

  function toggleTorch() {
    if (!isScanning || !html5QrCode) {
      ModalController.showToast("Torch is only available during live video streaming.", "info");
      return;
    }
    try {
      torchActive = !torchActive;
      html5QrCode.applyVideoConstraints({
        advanced: [{ torch: torchActive }]
      }).catch(function(err) {
        torchActive = false;
        ModalController.showToast("Torch / Flashlight not supported on this device.", "info");
      });
      updateScannerControlsUI();
    } catch (e) {
      console.warn("Torch error:", e);
    }
  }

  /**
   * Helper: Downscales large mobile photo (<canvas>) before decoding
   * Prevents ZXing memory exhaustion and accelerates decode to <50ms.
   */
  function downscaleImageBlob(file, maxDimension) {
    return new Promise(function(resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function() {
        URL.revokeObjectURL(url);
        var width = img.width;
        var height = img.height;

        if (width <= maxDimension && height <= maxDimension) {
          resolve(file);
          return;
        }

        if (width > height) {
          if (width > maxDimension) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          }
        } else {
          if (height > maxDimension) {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }

        var canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob(function(blob) {
          if (blob) {
            resolve(blob);
          } else {
            resolve(file);
          }
        }, "image/jpeg", 0.92);
      };
      img.onerror = function(err) {
        URL.revokeObjectURL(url);
        resolve(file);
      };
      img.src = url;
    });
  }

  /**
   * Accelerated Dual-Stage QR Decoder
   */
  function scanUploadedFile(file) {
    if (!file || isProcessingFile) return;
    isProcessingFile = true;
    initAudioContext();

    if (AppState.logActivity) {
      AppState.logActivity("snap", "ประมวลผลภาพถ่าย QR (Processing Photo)", {
        notes: (file ? file.name : "photo") + " (" + (file ? Math.round(file.size / 1024) : 0) + " KB)"
      });
    }

    ModalController.showToast("⚡ Scanning QR code...", "info", 2000);

    // Stage 1: Check native browser BarcodeDetector API (5ms GPU hardware acceleration)
    if ("BarcodeDetector" in window) {
      try {
        var detector = new BarcodeDetector({ formats: ["qr_code"] });
        createImageBitmap(file).then(function(bitmap) {
          return detector.detect(bitmap);
        }).then(function(barcodes) {
          if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
            isProcessingFile = false;
            onScanSuccess(barcodes[0].rawValue, null);
            return;
          }
          runFallbackScan(file);
        }).catch(function(e) {
          runFallbackScan(file);
        });
        return;
      } catch (errBD) {
        runFallbackScan(file);
        return;
      }
    }

    runFallbackScan(file);
  }

  function runFallbackScan(file) {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("qr-reader");
    }

    // Downscale photo to max 1280px for high-speed JS decoding
    downscaleImageBlob(file, 1280).then(function(processedBlob) {
      return html5QrCode.scanFile(processedBlob, false);
    }).then(function(decodedText) {
      isProcessingFile = false;
      onScanSuccess(decodedText, null);
    }).catch(function(downscaleErr) {
      // Last-chance attempt: scan original raw file with showImage=true
      html5QrCode.scanFile(file, true).then(function(decodedText) {
        isProcessingFile = false;
        onScanSuccess(decodedText, null);
      }).catch(function(finalErr) {
        isProcessingFile = false;
        if (AppState.logActivity) {
          AppState.logActivity("snap", "ถอดรหัสภาพไม่พบ QR (Decode Failed)", {
            status: "warning",
            notes: "No clear QR code found in captured photo"
          });
        }
        ModalController.showToast("No clear QR code detected. Please ensure good lighting and tap '📸 SNAP WITH CAMERA' again.", "error", 4500);
      });
    });
  }

  function onScanSuccess(decodedText, decodedResult) {
    var now = Date.now();
    var cleanCode = String(decodedText || "").trim();

    // Debounce to prevent multiple trigger cascades
    if (cleanCode === lastScannedCode && (now - lastScanTimestamp) < scanCooldownMs) {
      return;
    }

    lastScannedCode = cleanCode;
    lastScanTimestamp = now;

    // Check if scanned QR matches standard asset inventory format (e.g. 4356000-401000049664-0)
    var isStandardFormat = isValidAssetInventoryFormat(cleanCode);
    playSuccessChime();
    triggerHaptic(!isStandardFormat);

    if (AppState.logActivity) {
      AppState.logActivity("scan", "ตรวจพบรหัส QR (QR Detected)", {
        assetId: cleanCode,
        status: isStandardFormat ? "Good" : "Warning",
        notes: "Format: " + (isStandardFormat ? "Standard Inventory Code" : "Custom/Non-standard Code")
      });
    }

    // Visual pulse feedback on viewfinder
    flashViewfinder();

    // Look up asset via dynamic multi-sheet router
    ModalController.showToast("Resolving Asset: " + cleanCode, "info", 1500);

    ApiClient.lookupAsset(cleanCode)
      .then(function(res) {
        if (res && res.found && res.asset) {
          AuditController.displayScannedAsset(res.asset);
        } else {
          setTimeout(function() { lastScannedCode = null; }, 1800);
          AuditController.displayUnrecognizedAsset(cleanCode);
        }
      })
      .catch(function(err) {
        lastScannedCode = null;
        ModalController.showToast("Lookup error: " + err.toString(), "error");
      });
  }

  function onScanProgress(errorMessage) {
    // Normal frame-by-frame scanning status
  }

  function flashViewfinder() {
    var frame = document.querySelector(".scanner-overlay-box");
    if (frame) {
      frame.classList.add("ring-4", "ring-emerald-400");
      setTimeout(function() {
        frame.classList.remove("ring-4", "ring-emerald-400");
      }, 350);
    }
  }

  function showScanLaser(visible) {
    var laser = document.getElementById("scan-laser");
    if (laser) {
      laser.style.display = visible ? "block" : "none";
    }
  }

  function updateScannerControlsUI() {
    var startBtn = document.getElementById("btn-start-scanner");
    var stopBtn = document.getElementById("btn-stop-scanner");
    var torchBtn = document.getElementById("btn-toggle-torch");
    var placeholder = document.getElementById("scanner-placeholder");

    if (startBtn) startBtn.classList.toggle("hidden", isScanning);
    if (stopBtn) stopBtn.classList.toggle("hidden", !isScanning);
    if (torchBtn) {
      torchBtn.classList.toggle("text-amber-400", torchActive);
      torchBtn.classList.toggle("bg-amber-500/20", torchActive);
    }
    if (placeholder) placeholder.classList.toggle("hidden", isScanning);
  }

  function resetLastScannedCode() {
    lastScannedCode = null;
    lastScanTimestamp = 0;
  }

  return {
    startScanner: startScanner,
    stopScanner: stopScanner,
    openNativeCameraSnap: openNativeCameraSnap,
    openGalleryPicker: openGalleryPicker,
    toggleCameraFacing: toggleCameraFacing,
    toggleTorch: toggleTorch,
    scanUploadedFile: scanUploadedFile,
    playSuccessChime: playSuccessChime,
    triggerHaptic: triggerHaptic,
    isValidAssetInventoryFormat: isValidAssetInventoryFormat,
    initAudioContext: initAudioContext,
    resetLastScannedCode: resetLastScannedCode
  };
})();
</script>
