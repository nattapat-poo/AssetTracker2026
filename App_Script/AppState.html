<script>
/**
 * AppState.html — Reactive Client State Management Store
 * Project 08: QR-Based Mobile Asset Survey App (v1.1.8h)
 * MUIDS Lab Oops OS — Science Department
 */

window.AppState = (function() {
  var STORAGE_KEY = "MUIDS_ACTIVITY_LOGS_v1.1.8j";
  var LEGACY_KEY = "MUIDS_ACTIVITY_LOGS_v1.1.8i";

  var initialLogs = (function() {
    try {
      if (typeof localStorage !== "undefined") {
        var saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
        if (saved) {
          var parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) return parsed;
        }
      }
    } catch (e) {}
    return [];
  })();

  var state = {
    user: { email: "nattapat.poo@mahidol.ac.th", name: "Mek", role: "SuperAdmin", isAdmin: true, isSuperAdmin: true, isMahidolAccount: true, isNexusAuthorized: true, isVerified: true, authStatus: "VERIFIED" },
    config: {},
    rooms: [],
    currentRoom: "Master_Asset",
    statusFilter: "ALL", // ALL, UNVERIFIED, Good, Damaged, Missing
    searchQuery: "",
    selectedAsset: null,
    summary: {
      roomName: "Master_Asset",
      total: 0,
      verified: 0,
      unverified: 0,
      good: 0,
      damaged: 0,
      missing: 0,
      percentComplete: 0,
      items: []
    },
    isScannerRunning: false,
    autoResumeScanner: true,
    soundEnabled: true,
    hapticEnabled: true,
    theme: "dark",
    recentScans: [],
    activityLogs: initialLogs,
    pendingSync: false,
    activeTab: "roster", // "roster" (default landing tab), "scanner", "summary"
    isScanning: false,
    cameraFacing: "environment" // environment (rear) or user (front)
  };

  var listeners = {};

  function subscribe(eventName, callback) {
    if (!listeners[eventName]) {
      listeners[eventName] = [];
    }
    listeners[eventName].push(callback);
    return function unsubscribe() {
      listeners[eventName] = listeners[eventName].filter(function(cb) { return cb !== callback; });
    };
  }

  function notify(eventName, payload) {
    if (listeners[eventName]) {
      listeners[eventName].forEach(function(callback) {
        try {
          callback(payload, state);
        } catch (err) {
          console.error("[AppState] Listener error for " + eventName + ":", err);
        }
      });
    }
  }

  function get(key) {
    if (!key) return Object.assign({}, state);
    return state[key];
  }

  function getVersion() {
    var CURRENT_RELEASE = "v1.1.8j";
    if (state.config && state.config.APP_VERSION && String(state.config.APP_VERSION).trim() !== "") {
      var cfgVer = String(state.config.APP_VERSION).trim();
      // Ignore obsolete legacy versions that might still sit in the Google Sheet
      if (cfgVer.indexOf("1.1.7") === -1 && cfgVer.indexOf("1.1.8a") === -1 && cfgVer.indexOf("1.1.8b") === -1 &&
          cfgVer.indexOf("1.1.8c") === -1 && cfgVer.indexOf("1.1.8d") === -1 && cfgVer.indexOf("1.1.8e") === -1 &&
          cfgVer.indexOf("1.1.8f") === -1 && cfgVer.indexOf("1.1.8g") === -1 && cfgVer.indexOf("1.1.8h") === -1 &&
          cfgVer.indexOf("1.1.8i") === -1) {
        return cfgVer.indexOf("v") === 0 ? cfgVer : ("v" + cfgVer);
      }
    }
    return CURRENT_RELEASE;
  }

  function applyGlobalVersion(ver) {
    var displayVer = getVersion();
    
    // Update all elements carrying version class or specific IDs across the entire DOM
    var targets = document.querySelectorAll(".app-version-label, .app-version-badge, #header-version-badge, #footer-version-text, #canvas-version-badge, #dev-modal-version");
    targets.forEach(function(el) {
      if (el.id === "header-version-badge") {
        el.innerText = displayVer + " • Mobile Audit";
      } else if (el.id === "footer-version-text") {
        el.innerText = "QR Asset Survey • MUIDS Science Dept • " + displayVer;
      } else {
        el.innerText = displayVer;
      }
    });
  }

  function applyUserDisplay() {
    var user = state.user;
    if (!user) return;
    var userTxt = document.getElementById("header-user-text");
    var userIcon = document.getElementById("header-user-icon");
    var userBadge = document.getElementById("header-user-badge");
    if (!userTxt) return;

    var displayName = user.nickname || (user.name ? user.name.split(" ")[0] : (user.email ? user.email.split("@")[0] : "User"));
    var role = user.role || "Admin";
    userTxt.innerText = displayName + " (" + role + ")";

    var isVerified = !!(user.isVerified || user.isSuperAdmin || (user.isAdmin && user.email && user.email.indexOf("@mahidol") !== -1));
    if (userBadge) {
      if (isVerified) {
        userBadge.className = "cursor-pointer bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 px-2.5 py-0.5 rounded-full flex items-center gap-1.5 transition text-[10.5px] font-medium max-w-[200px]";
        if (userIcon) userIcon.className = "fa-solid fa-circle-user text-[11px] text-emerald-400 shrink-0";
      } else {
        userBadge.className = "cursor-pointer bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 px-2.5 py-0.5 rounded-full flex items-center gap-1.5 transition text-[10.5px] font-medium max-w-[200px]";
        if (userIcon) userIcon.className = "fa-solid fa-triangle-exclamation text-[11px] text-amber-400 shrink-0";
      }
    }
  }

  function set(key, value) {
    if (key === "user" && value) {
      // Ecosystem Lead SuperAdmin guarantee
      if (value.email && (value.email === "nattapat.poo@mahidol.ac.th" || value.email.indexOf("nattapat.poo") !== -1)) {
        value.isSuperAdmin = true;
        value.isAdmin = true;
        value.isVerified = true;
        value.role = "SuperAdmin";
        value.authStatus = "VERIFIED";
      }
    }
    var prev = state[key];
    state[key] = value;
    if (key === "config" && value) {
      applyGlobalVersion();
    }
    if (key === "user" && value) {
      applyUserDisplay();
    }
    notify("change:" + key, { key: key, value: value, prev: prev });
    notify("change", { key: key, value: value, prev: prev });
  }

  function update(patch) {
    if (typeof patch === "object" && patch !== null) {
      Object.keys(patch).forEach(function(k) {
        state[k] = patch[k];
      });
      if (patch.config) {
        applyGlobalVersion();
      }
      if (patch.user) {
        applyUserDisplay();
      }
      notify("update", patch);
    }
  }

  function getFilteredItems() {
    var items = (state.summary && state.summary.items) ? state.summary.items : [];
    var statusFilter = state.statusFilter;
    var query = (state.searchQuery || "").trim().toLowerCase();
    
    return items.filter(function(item) {
      // 1. Status Filter
      if (statusFilter === "UNVERIFIED" || statusFilter === "Unverified" || statusFilter === "Pending" || statusFilter === "ยังไม่ได้สำรวจ") {
        var s = String(item.scanned69 || item.status || "").trim();
        var isVer = (s !== "" && s !== "Unverified" && s !== "-");
        if (isVer) return false;
      } else if (statusFilter && statusFilter !== "ALL") {
        var rawStatus = String(item.scanned69 || item.status || "").trim();
        var rawRemark = String(item.auditResult69 || "").trim();
        var combined = (rawStatus + " " + rawRemark).toLowerCase();

        if (statusFilter === "Good") {
          var isGood = (item.status === "Good" || rawStatus === "Good" || 
                        (rawStatus.indexOf("ใช้งานอยู่") !== -1 && rawStatus.indexOf("ชำรุด") === -1) ||
                        combined.indexOf("good") !== -1);
          if (!isGood) return false;
        } else if (statusFilter === "Damaged") {
          var isDamaged = (item.status === "Damaged" || rawStatus === "Damaged" || 
                           combined.indexOf("ชำรุด") !== -1 || combined.indexOf("damaged") !== -1);
          if (!isDamaged) return false;
        } else if (statusFilter === "Missing") {
          var isMissing = (item.status === "Missing" || rawStatus === "Missing" || 
                           combined.indexOf("สูญหาย") !== -1 || combined.indexOf("หาไม่เจอ") !== -1 ||
                           combined.indexOf("ไม่พบ") !== -1 || combined.indexOf("งง+") !== -1 ||
                           combined.indexOf("missing") !== -1);
          if (!isMissing) return false;
        } else {
          var st = item.scanned69 || item.status;
          if (st !== statusFilter) return false;
        }
      }
      
      // 2. Search Query Filter (Strictly Cols B, D, I, M, N, O)
      if (query) {
        var idMatch = String(item.assetId || "").toLowerCase().indexOf(query) !== -1;         // Col B
        var nameMatch = String(item.itemName || "").toLowerCase().indexOf(query) !== -1;     // Col D
        var locMatch = String(item.registeredLocation || "").toLowerCase().indexOf(query) !== -1; // Col I
        var statusMatch = String(item.scanned69 || item.status || "").toLowerCase().indexOf(query) !== -1; // Col M
        var remMatch = String(item.auditResult69 || "").toLowerCase().indexOf(query) !== -1; // Col N
        var stickerMatch = String(item.sticker || "").toLowerCase().indexOf(query) !== -1;   // Col O
        if (!idMatch && !nameMatch && !locMatch && !statusMatch && !remMatch && !stickerMatch) {
          return false;
        }
      }
      
      return true;
    });
  }

  function addRecentScan(scanRecord) {
    state.recentScans.unshift(scanRecord);
    if (state.recentScans.length > 20) {
      state.recentScans.pop();
    }
    notify("change:recentScans", state.recentScans);
  }

  function logActivity(type, title, details) {
    var now = new Date();
    var timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    var dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    var entry = {
      id: "log_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
      timestamp: timeStr,
      date: dateStr,
      type: type || "audit", // "audit", "move", "rename", "unlisted", "scan", "sync", "camera", "snap", "toast"
      title: title || "Activity Logged",
      assetId: (details && details.assetId) || "",
      itemName: (details && details.itemName) || "",
      status: (details && details.status) || "",
      sticker: (details && details.sticker) || "",
      room: (details && details.room) || "",
      notes: (details && details.notes) || "",
      user: (state.user && state.user.email) || ""
    };

    state.activityLogs.unshift(entry);
    if (state.activityLogs.length > 100) {
      state.activityLogs.pop();
    }
    try {
      if (typeof localStorage !== "undefined") {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.activityLogs));
      }
    } catch (e) {}

    notify("change:activityLogs", state.activityLogs);
    return entry;
  }

  function clearActivityLogs() {
    state.activityLogs = [];
    try {
      if (typeof localStorage !== "undefined") {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LEGACY_KEY);
      }
    } catch (e) {}
    notify("change:activityLogs", []);
  }

  return {
    get: get,
    set: set,
    update: update,
    subscribe: subscribe,
    notify: notify,
    getVersion: getVersion,
    applyGlobalVersion: applyGlobalVersion,
    applyUserDisplay: applyUserDisplay,
    getFilteredItems: getFilteredItems,
    addRecentScan: addRecentScan,
    logActivity: logActivity,
    clearActivityLogs: clearActivityLogs,
    getActivityLogs: function() { return state.activityLogs.slice(); }
  };
})();
</script>
