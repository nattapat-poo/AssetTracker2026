<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Prompt', -apple-system, sans-serif;
    }
    body {
      background-color: #020617;
      color: #f8fafc;
      padding: 16px;
      font-size: 13px;
      overflow-x: hidden;
    }
    .header {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    
    /* Top Control Bar */
    .top-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .select-all-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #38bdf8;
      font-size: 12px;
      user-select: none;
    }
    .counter-badge {
      font-size: 11px;
      font-weight: 600;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 2px 8px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scrollable sheet list */
    .sheet-list-container {
      max-height: 310px;
      overflow-y: auto;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 4px;
    }
    .sheet-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      transition: background 0.15s;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid rgba(30, 41, 59, 0.4);
    }
    .sheet-item:last-child {
      border-bottom: none;
    }
    .sheet-item:hover {
      background: #131d31;
    }
    .sheet-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sheet-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #10b981;
      cursor: pointer;
    }
    .sheet-name {
      font-weight: 500;
      color: #e2e8f0;
      font-size: 13px;
    }
    .sheet-meta {
      font-size: 11px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Footer & Action Buttons */
    .footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #34d399, #10b981);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-weight: 500;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #334155;
      color: #f8fafc;
    }

    /* Status and Alert Messages */
    .status-msg {
      display: none;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-msg.loading {
      display: block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }
    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }
    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h2><?= typeof modalTitle !== 'undefined' && modalTitle ? modalTitle : "📥 Combine Sheets into Master Table" ?></h2>
    <p><?= typeof modalDescription !== 'undefined' && modalDescription ? modalDescription : "Check the boxes for room sheets to aggregate into <strong>Master_Asset</strong>. Columns A–T will be strictly aligned." ?></p>
  </div>

  <!-- Top Controls: Select All / Deselect All -->
  <div class="top-controls">
    <label class="select-all-label" for="selectAllCheckbox">
      <input type="checkbox" id="selectAllCheckbox" class="sheet-checkbox" checked onchange="handleSelectAllToggle(this.checked)">
      <span>Select All / Deselect All</span>
    </label>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span id="counterBadge" class="counter-badge">0 selected</span>
    </div>
  </div>

  <!-- Scrollable Sheet Checkbox List -->
  <div class="sheet-list-container" id="sheetListContainer">
    <div style="padding: 24px; text-align: center; color: #64748b;">
      <div class="spinner" style="border-top-color: #38bdf8; margin-bottom: 8px;"></div>
      <div>Loading available room sheets...</div>
    </div>
  </div>

  <!-- Status / Progress Banner -->
  <div id="statusMsg" class="status-msg"></div>

  <!-- Footer Actions -->
  <div class="footer">
    <button type="button" class="btn-secondary" id="btnCancel" onclick="handleCancel()">Cancel</button>
    <button type="button" class="btn-primary" id="btnCombine" onclick="handleCombine()">
      <span id="btnSpinner" class="spinner" style="display: none;"></span>
      <span id="btnText"><?= typeof actionButtonText !== 'undefined' && actionButtonText ? actionButtonText : "📥 Combine into Master Sheet" ?></span>
    </button>
  </div>

  <script>
    // Injected template configuration and sheets if evaluated with data
    var initialSheets = <?!= (typeof sheets !== 'undefined' && sheets) ? JSON.stringify(sheets) : 'null' ?>;
    var actionMode = <?!= JSON.stringify(typeof mode !== 'undefined' && mode ? mode : 'aggregate') ?>;
    var defaultBtnText = <?= JSON.stringify(typeof actionButtonText !== 'undefined' && actionButtonText ? actionButtonText : "📥 Combine into Master Sheet") ?>;

    window.addEventListener("DOMContentLoaded", function() {
      if (initialSheets && Array.isArray(initialSheets) && initialSheets.length > 0) {
        renderSheetList(initialSheets);
      } else {
        fetchSheetsFromServer();
      }
    });

    function fetchSheetsFromServer() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(renderSheetList)
          .withFailureHandler(function(err) {
            showStatus("Failed to load sheets: " + err.toString(), "error");
          })
          .getAvailableSheetsForAggregation();
      }
    }

    function renderSheetList(sheets) {
      var container = document.getElementById("sheetListContainer");
      if (!sheets || sheets.length === 0) {
        container.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">No eligible room sheets found in this spreadsheet.</div>';
        updateCounter(0, 0);
        return;
      }

      var html = '';
      sheets.forEach(function(s, idx) {
        var isChecked = (s.checked !== false) ? 'checked' : '';
        var metaText = s.rowCount ? (s.rowCount + ' rows') : '';
        
        html += '<div class="sheet-item" onclick="toggleRowCheckbox(' + idx + ', event)">' +
                  '<div class="sheet-left">' +
                    '<input type="checkbox" id="sheet_cb_' + idx + '" class="sheet-checkbox item-cb" value="' + escapeAttr(s.name) + '" ' + isChecked + ' onchange="updateSelectionState()">' +
                    '<span class="sheet-name">' + escapeHtml(s.name) + '</span>' +
                  '</div>' +
                  '<span class="sheet-meta">' + escapeHtml(metaText) + '</span>' +
                '</div>';
      });

      container.innerHTML = html;
      updateSelectionState();
    }

    function toggleRowCheckbox(idx, event) {
      if (event.target && event.target.tagName === 'INPUT') return; // let checkbox naturally toggle
      var cb = document.getElementById('sheet_cb_' + idx);
      if (cb) {
        cb.checked = !cb.checked;
        updateSelectionState();
      }
    }

    function handleSelectAllToggle(isChecked) {
      var cbs = document.querySelectorAll('.item-cb');
      cbs.forEach(function(cb) {
        cb.checked = isChecked;
      });
      updateSelectionState();
    }

    function updateSelectionState() {
      var cbs = document.querySelectorAll('.item-cb');
      var checkedCount = 0;
      cbs.forEach(function(cb) {
        if (cb.checked) checkedCount++;
      });

      var selectAllCb = document.getElementById("selectAllCheckbox");
      if (selectAllCb) {
        if (checkedCount === 0) {
          selectAllCb.checked = false;
          selectAllCb.indeterminate = false;
        } else if (checkedCount === cbs.length) {
          selectAllCb.checked = true;
          selectAllCb.indeterminate = false;
        } else {
          selectAllCb.checked = false;
          selectAllCb.indeterminate = true;
        }
      }

      updateCounter(checkedCount, cbs.length);
      
      var btnCombine = document.getElementById("btnCombine");
      if (btnCombine) {
        btnCombine.disabled = (checkedCount === 0);
      }
    }

    function updateCounter(selected, total) {
      var badge = document.getElementById("counterBadge");
      if (badge) {
        badge.innerText = selected + ' of ' + total + ' selected';
      }
    }

    function handleCancel() {
      if (typeof google !== 'undefined' && google.script && google.script.host) {
        google.script.host.close();
      }
    }

    function handleCombine() {
      var selected = [];
      document.querySelectorAll('.item-cb:checked').forEach(function(cb) {
        selected.push(cb.value);
      });

      if (selected.length === 0) {
        showStatus("Please select at least one room sheet to proceed.", "error");
        return;
      }

      if (actionMode === 'setupRow5') {
        // Mode 1: Setup Row 5 Audit Columns
        setProcessing(true, "Formatting Row 5 audit columns on " + selected.length + " room sheet(s)... Columns M–U configuring...");

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(res) {
              setProcessing(false);
              showStatus("✅ " + (res.message || "Row 5 audit columns configured successfully!"), "success");
              setTimeout(function() {
                google.script.host.close();
              }, 1400);
            })
            .withFailureHandler(function(err) {
              setProcessing(false);
              showStatus("❌ Setup failed: " + err.toString(), "error");
            })
            .runSetupRow5WithSelectedSheets(selected);
        } else {
          setTimeout(function() {
            setProcessing(false);
            showStatus("✅ Mock Setup complete: Configured Row 5 on " + selected.length + " sheets.", "success");
          }, 1000);
        }
      } else {
        // Mode 2 (Default): Aggregation into Master_Asset
        setProcessing(true, "Aggregating " + selected.length + " sheets into Master_Asset... Columns A–F aligning...");

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(res) {
              setProcessing(false);
              showStatus("✅ " + (res.message || "Master table updated successfully!"), "success");
              setTimeout(function() {
                google.script.host.close();
              }, 1400);
            })
            .withFailureHandler(function(err) {
              setProcessing(false);
              showStatus("❌ Aggregation failed: " + err.toString(), "error");
            })
            .runAggregationWithSelectedSheets(selected);
        } else {
          setTimeout(function() {
            setProcessing(false);
            showStatus("✅ Mock Aggregation complete: Combined " + selected.length + " sheets into Master_Asset.", "success");
          }, 1000);
        }
      }
    }

    function setProcessing(isLoading, text) {
      var btnCombine = document.getElementById("btnCombine");
      var btnCancel = document.getElementById("btnCancel");
      var btnSpinner = document.getElementById("btnSpinner");
      var btnText = document.getElementById("btnText");

      if (btnCombine) btnCombine.disabled = isLoading;
      if (btnCancel) btnCancel.disabled = isLoading;
      if (btnSpinner) btnSpinner.style.display = isLoading ? "inline-block" : "none";
      if (btnText) {
        if (isLoading) {
          btnText.innerText = (actionMode === 'setupRow5') ? "Formatting Sheets..." : "Combining Sheets...";
        } else {
          btnText.innerText = defaultBtnText;
        }
      }

      if (isLoading && text) {
        showStatus(text, "loading");
      }
    }

    function showStatus(msg, type) {
      var el = document.getElementById("statusMsg");
      if (!el) return;
      el.className = "status-msg " + type;
      el.innerHTML = (type === 'loading' ? '<span class="spinner" style="margin-right: 6px;"></span>' : '') + escapeHtml(msg);
      el.style.display = "block";
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
